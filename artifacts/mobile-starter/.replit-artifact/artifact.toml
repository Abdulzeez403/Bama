kind = "mobile"
previewPath = "/"
title = "Mobile Starter"
description = "A polished Expo React Native starter app with a focused home experience, local persistence, reusable UI, and navigation ready for a custom product workflow."
version = "1.0.0"
id = "artifacts/mobile-starter"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23766

[services.development]
run = "pnpm --filter @workspace/mobile-starter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile-starter", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile-starter", "run", "serve" ]

[services.env]
PORT = "23766"
BASE_PATH = "/"
